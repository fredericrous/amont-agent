[package]
name = "amont-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "A guard for Claude Code's tool calls: it reads each one before it runs, the work-process verdicts (plan review, implementation review, preview) included"
readme = "README.md"
keywords = ["claude", "hooks", "guard", "shell", "git"]
categories = ["development-tools", "command-line-utilities"]

# MEASURED, not inherited. `cargo +1.84.0 check --locked` fails and
# `cargo +1.85.0 check --locked` passes, so 1.85.0 is the floor.
#
# It is not the 1.74 this crate claimed inside the amont workspace, and the
# difference is the point. That number was the COMMIT PATH's floor, verified
# against two dependency-free crates and inherited by this one, which has
# dependencies. Its own manifest comment said so: "this number has no guard
# and will drift the first time a dependency raises its own." It had already
# drifted — serde_json's `preserve_order` pulls indexmap, which pulls
# hashbrown 0.17.1, which is edition 2024 and declares 1.85.0. Cargo 1.74
# cannot parse that manifest at all, so every published `amont-agent` up to
# 1.18.2 carried a floor nothing could build at.
#
# The msrv job checks THIS crate with `--locked`, so the number is a claim
# again rather than a comment with syntax. Raising it is a release note.
rust-version.workspace = true

[dependencies]
amont-agent-guard.workspace = true
amont-agent-process.workspace = true
# The binary's own JSON (`analyze --json`) and its integration tests read
# and write `Value`s; why this crate reads with serde_json and never derives
# is argued in the guard's manifest, where most of the parsing lives.
serde_json = { version = "1", features = ["preserve_order"] }


# NO [dev-dependencies]. `serde_json` above is a normal dependency and is
# therefore already in scope for this crate's tests — restating it buys
# nothing and costs two places to bump.

# What we WRITE is emitted by `crates/amont-agent-guard/src/json.rs`, a hand-rolled escaper, so the
# hook's answer shares no representation with the payloads we parse.

[features]
# Failure injection for the integration tests, which spawn the binary and so
# cannot use `cfg(test)`. Never on in a build that ships: nothing reachable
# from the CLI reads these variables without it. The hooks live in the guard.
test-hooks = ["amont-agent-guard/test-hooks"]

[profile.release]
strip = true
opt-level = "s"
lto = true

# No `panic = "abort"`. It would save a little size and cost the `catch_unwind`
# isolation around rule evaluation: a panic in one rule must not take down a
# hook that Claude Code is waiting on, because a guard that dies mid-decision
# is a guard that has no opinion at the exact moment it was asked for one.

[workspace]
# The binary at the root, and its two components (decisions ADR-0039; plan
# docs/plans/2026-10-19-guard-and-work-process-components.md). The crate
# graph holds the boundary: the guard never names the work process or the
# binary, and the work process never names the binary.
members = [".", "crates/amont-agent-guard", "crates/amont-agent-process"]
# The analyzer's syntax oracle is its own workspace, on purpose.
exclude = ["tools/shell-oracle"]

# Shared, so the three crates cannot disagree about who they are. The
# version is one for all three: `cargo install amont-agent` resolves the
# libraries by version, so a release where they differ is one nobody can
# install.
[workspace.package]
version = "3.7.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/fredericrous/amont-agent"
authors = ["Frederic Rousseau"]
rust-version = "1.85.0"

# The one place the inter-crate version is written: `path` for a checkout,
# `version` for crates.io, exact because they are released together.
[workspace.dependencies]
amont-agent-guard = { path = "crates/amont-agent-guard", version = "=3.7.1" }
amont-agent-process = { path = "crates/amont-agent-process", version = "=3.7.1" }

[workspace.lints.clippy]
# adr-lint sync: general.linters-police-suppressions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[lints]
workspace = true
