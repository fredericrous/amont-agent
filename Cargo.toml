[package]
name = "amont-agent"
version = "2.24.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/fredericrous/amont-agent"
authors = ["Frederic Rousseau"]
description = "A guard that inspects a shell command before Claude Code runs it"
readme = "README.md"
keywords = ["claude", "hooks", "guard", "shell", "git"]
categories = ["development-tools", "command-line-utilities"]

# MEASURED, not inherited. `cargo +1.84.0 check --locked` fails and
# `cargo +1.85.0 check --locked` passes, so 1.85.0 is the floor.
#
# It is not the 1.74 this crate claimed inside the amont workspace, and the
# difference is the point. That number was the COMMIT PATH's floor, verified
# against two dependency-free crates and inherited by this one, which has
# dependencies. Its own manifest comment said so: "this number has no guard
# and will drift the first time a dependency raises its own." It had already
# drifted — serde_json's `preserve_order` pulls indexmap, which pulls
# hashbrown 0.17.1, which is edition 2024 and declares 1.85.0. Cargo 1.74
# cannot parse that manifest at all, so every published `amont-agent` up to
# 1.18.2 carried a floor nothing could build at.
#
# The msrv job checks THIS crate with `--locked`, so the number is a claim
# again rather than a comment with syntax. Raising it is a release note.
rust-version = "1.85.0"

[dependencies]
# For READING, not writing. Three things need a real parser and none is
# ours: Claude Code's hook payload, the user's `settings.json`, and the
# Markdown of a plan (below).
#
# Deliberately no `serde` derive. The payload's shape is defined by somebody
# else and grows between releases; `Value` plus hand-written accessors turns
# a missing or retyped field into "no opinion", which is this crate's whole
# posture. A `#[derive(Deserialize)]` struct turns the same field into a hard
# parse error, and the temptation is then to treat that error as an opinion.
#
# `preserve_order` is load-bearing, not cosmetic: without it, rewriting a
# user's hand-edited `settings.json` reorders their keys alphabetically and
# produces a diff that looks like we rewrote the file. We did.
serde_json = { version = "1", features = ["preserve_order"] }

# Only for `Value::serialize` with a custom PrettyFormatter, which is how
# `settings.json` keeps the indentation the user chose instead of being
# reformatted to serde_json's default.
serde = "1"

# A plan's sha (`plan_review::body_sha`) is taken over the Markdown as
# CommonMark reads it, so a formatter that only moves blank lines, list
# markers or table padding keeps the review bound, while `a * b` and a list
# item `* b` stay different things. Telling those apart needs block context:
# a parser, not a line rule (2026-10-06, docs/plans/2026-10-06-plan-sha-ignores-formatting.md).
#
# PINNED EXACTLY: a parser change may change the sha of every plan and
# turn every review in flight stale. A bump is its own PR, and the
# `body_sha` fixture test is what tells you whether it re-hashes.
pulldown-cmark = { version = "=0.13.4", default-features = false }

# NO [dev-dependencies]. `serde_json` above is a normal dependency and is
# therefore already in scope for this crate's tests — restating it buys
# nothing and costs two places to bump.

# What we WRITE is emitted by `src/json.rs`, a hand-rolled escaper, so the
# hook's answer shares no representation with the payloads we parse.

[profile.release]
strip = true
opt-level = "s"
lto = true

# No `panic = "abort"`. It would save a little size and cost the `catch_unwind`
# isolation around rule evaluation: a panic in one rule must not take down a
# hook that Claude Code is waiting on, because a guard that dies mid-decision
# is a guard that has no opinion at the exact moment it was asked for one.
