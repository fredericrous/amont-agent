# greenpiste's manifest for grh (Green Harness), the v2 format of grh's
# docs/extension-manifest.md. grh pins the copy each release publishes.
#
# No sums here, and no [tool.release]: the tarballs this would describe do
# not exist when the file is committed. The release job writes
# [tool.release] (repo, version, the sha256 of each unix tarball) into a copy
# in dist/ before SHA256SUMS is computed (scripts/release-manifest.py).
# The release guard checks [extension] version against the tag.

[extension]
name = "greenpiste"
version = "3.35.0"
harness = ">=0.3"
summary = "what an agent's tool call may do: a Claude Code hook"
needs = []
aliases = ["guardrails"]

# `amont-agent` is the old name, kept as a copy beside the binary until the
# programme's census finds no program still calling it.
[tool]
bin = "greenpiste"
bin_aliases = ["amont-agent"]

[tool.machine]
install = ["{bin}", "install", "--write"]
uninstall = ["{bin}", "uninstall", "--write"]
requires = ["claude"]
[tool.machine.status]
args = ["doctor", "--json"]
json = ["integration", "state"]

[[recommend]]
when = ["machine_present"]
verdict = "already here"
reason = "greenpiste's integration is installed"

[[recommend]]
when = []
verdict = "recommend"
reason = "a git repository: keep agents inside the rules"
