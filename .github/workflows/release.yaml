name: Release

# Cutting a release means: a tag, prebuilt binaries for every platform this
# guard claims to support, and checksums.
#
# Triggered by the TAG, never by a branch push. The tag is the decision.

on:
  push:
    tags: ["v*"]
  # So a release can be rehearsed end to end without publishing one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (dry run — no release is published)"
        required: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # The tag and the manifest must agree BEFORE anything is built.
  #
  # The footgun that motivated this: a commit-msg hook rejects a commit, the
  # shell carries on to `git tag`, and the tag lands on the OLD head — so CI
  # builds and publishes the new version number from stale code. Registries
  # are immutable; the wrong bytes under a version cannot be replaced, only
  # superseded. Checking costs four lines and runs first.
  guard:
    name: the tag says what the manifest says
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          set -euo pipefail
          # Three crates, one version: the binary and its two libraries
          # (greenpiste-guard, greenpiste-process). `cargo install` resolves
          # the libraries by version, so a release where they differ is one
          # nobody can install; read all three, and the exact pins between
          # them, and refuse any disagreement.
          versions=$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, sys
          m = json.load(sys.stdin)
          names = {"greenpiste", "greenpiste-guard", "greenpiste-process"}
          pkgs = {p["name"]: p for p in m["packages"] if p["name"] in names}
          assert set(pkgs) == names, sorted(pkgs)
          vs = {p["version"] for p in pkgs.values()}
          pins = {d["req"] for p in pkgs.values() for d in p["dependencies"] if d["name"] in names}
          print(" ".join(sorted(vs)), "|", " ".join(sorted(pins)))')
          echo "crate versions | inter-crate pins: $versions"
          manifest=${versions%% |*}
          case "$manifest" in *" "*) echo "::error::the three crates disagree on their version: $manifest"; exit 1;; esac
          if [ "${versions#*| }" != "=$manifest" ]; then
            echo "::error::the inter-crate pins (${versions#*| }) are not =$manifest; bump [workspace.dependencies] with the version."
            exit 1
          fi
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            dry=false
          else
            tag="${{ inputs.tag }}"
            tag="${tag#v}"
            [ -n "$tag" ] || tag="$manifest"
            dry=true
          fi
          echo "manifest=$manifest tag=$tag dry_run=$dry"
          # greenharness.toml is what grh pins; its version is the crates'.
          declared=$(python3 -I -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["extension"]["version"])' greenharness.toml)
          if [ "$declared" != "$manifest" ]; then
            echo "::error::greenharness.toml declares $declared, the crates are $manifest."
            exit 1
          fi
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag v$tag does not match the manifest version $manifest."
            echo "::error::Commit the version bump FIRST, confirm HEAD moved, then tag."
            exit 1
          fi
          # The release notes lead with CHANGELOG.md's section for this
          # version, so a missing section would publish a release that opens
          # with nothing. Refuse now, while writing it costs one commit
          # instead of a re-release.
          if ! awk -v ver="v$manifest" '$1 == "##" && $2 == ver { found = 1 } END { exit !found }' CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## v$manifest' section."
            echo "::error::Write what the upgrader gets, then tag."
            exit 1
          fi
          echo "version=$manifest" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
      # Before anything is published anywhere: every crate packages and builds
      # from its own tarball. A file a crate embeds from outside its directory,
      # or a library the next one cannot resolve, fails here, while nothing is
      # out yet; inside publish-crates it would fail after the GitHub release.
      - name: every crate packages (dry run)
        run: cargo publish --workspace --dry-run --locked

  build:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One broken target must not hide the others: a partial release is
      # something to see in full, not to discover one platform at a time.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          # Static, so it runs on distros older than the runner's glibc — the
          # usual reason a "linux" binary fails for somebody.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            packages: musl-tools
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain for ${{ matrix.target }}
        run: rustup target add ${{ matrix.target }}
      - name: Install cross-compilation packages
        if: matrix.packages != ''
        # The Azure apt mirror hung `apt-get update` for a full job budget
        # three releases running in amont. Three defences, each sufficient
        # alone: the canonical archive instead of the Azure mirror, a
        # per-fetch timeout with retries, and a step budget so a hang costs
        # five minutes and a cheap rerun, not the release.
        timeout-minutes: 5
        run: |
          # The runner routes apt through `mirror+file:/etc/apt/apt-mirrors.txt`,
          # so rewriting the sources files alone still let every fetch start at
          # the Azure mirror. Rewrite the mirror LIST, which is the knob the
          # image actually reads.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu\tpriority:1\n' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 install -y ${{ matrix.packages }}
      - name: Point cargo at the cross linker
        if: matrix.linker != ''
        run: |
          target_upper=$(echo "${{ matrix.target }}" | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target_upper}_LINKER=${{ matrix.linker }}" >> "$GITHUB_ENV"

      - run: cargo build -p greenpiste --release --locked --target ${{ matrix.target }}

      # Two archive sets from one build: greenpiste-<v>-<t>, and
      # amont-agent-<v>-<t> holding a regular-file copy of the same binary
      # under the old name, which installers and grh pins from before the
      # rename still fetch. The alias set goes when the census finds no
      # program still reading the old name.
      - name: Archive
        id: archive
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; else ext=""; fi
          assets=""
          for pair in "greenpiste greenpiste" "amont-agent amont-agent"; do
            set -- $pair
            name="$1-${version}-${{ matrix.target }}"
            bin_name="$2"
            staging="dist/$name"
            mkdir -p "$staging"
            cp README.md LICENSE "$staging/"
            cp "target/${{ matrix.target }}/release/greenpiste$ext" "$staging/$bin_name$ext"
            if [ "${{ runner.os }}" = "Windows" ]; then
              (cd dist && 7z a "$name.zip" "$name" > /dev/null)
              assets="$assets dist/$name.zip"
            else
              (cd dist && tar czf "$name.tar.gz" "$name")
              assets="$assets dist/$name.tar.gz"
            fi
          done
          {
            echo "assets<<EOF"
            for asset in $assets; do echo "$asset"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Prove the thing we are about to hand people actually runs, and that it
      # still DECIDES — a binary that answers `--help` and then refuses nothing
      # is the defect `cargo test` structurally cannot see, because tests never
      # touch the packaged artifact.
      - name: The packaged binary runs, and still says no
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          bin="dist/greenpiste-${version}-${{ matrix.target }}/greenpiste"
          alias_bin="dist/amont-agent-${version}-${{ matrix.target }}/amont-agent"
          # An `if`, not `[ … ] && …`: under `set -e` a false test as the last
          # command of a line is a FAILING step.
          if [ "${{ runner.os }}" = "Windows" ]; then bin="$bin.exe"; alias_bin="$alias_bin.exe"; fi
          # The alias archive holds the same bytes, a regular file.
          cmp "$bin" "$alias_bin"
          if [ ! -f "$alias_bin" ] || [ -L "$alias_bin" ]; then
            echo "::error::the alias archive's binary is not a regular file: $alias_bin"; exit 1
          fi

          # CAPTURE FIRST, then grep the variable — never `"$bin" | grep -q`.
          #
          # This step runs under `bash -e -o pipefail`. `grep -q` exits at its
          # first match and closes the pipe, and the binary — correctly, since
          # v2.0.0 — then dies of SIGPIPE with status 141 like any Unix
          # filter. Under pipefail that is a FAILED step, so the more
          # correctly the binary behaves the harder this breaks.
          #
          # Both spellings were wrong here in turn, which is why this comment
          # is long: before the SIGPIPE fix the same two lines failed with 101
          # (a Rust panic writing to the closed pipe) on this same target and
          # no other. A command substitution drains the output completely, so
          # there is no early reader and no signal either way.
          help=$("$bin" --help)
          printf '%s' "$help" | grep -q 'backtest'
          rules=$("$bin" rules)
          printf '%s' "$rules" | grep -q 'pipe-to-tail'
          # The real thing: one command through the real rule engine.
          out=$("$bin" check 'git push origin main 2>&1 | tail -5')
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'pipe-to-tail' || {
            echo "::error::the packaged binary did not refuse a piped push"; exit 1; }
          echo "the packaged binary runs and still decides"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ steps.archive.outputs.assets }}
          if-no-files-found: error

  # The blocking twin of ci.yaml's advisory audit — same parsing, opposite
  # stakes. On a PR an advisory is information; on a TAG it is about to be
  # compiled into six binaries and served to installers, so:
  #
  #   - a VULNERABILITY fails the release;
  #   - warning-class advisories (unmaintained/unsound) stay named annotations:
  #     a gate nothing can pass is a gate people learn to delete;
  #   - a fetch failure ALSO fails, unlike ci.yaml: "could not check" is not
  #     "clean", and an unchecked tree does not ship. On a PR you retry
  #     tomorrow; a release published today is immutable today.
  audit:
    name: no known vulnerabilities ship
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit
        run: |
          set -euo pipefail
          if ! cargo audit --json > audit.json; then
            # Distinguish "found something" from "could not ask". Only the
            # latter is fatal here regardless of content.
            if [ ! -s audit.json ]; then
              echo "::error::cargo audit produced no output — the tree is UNVERIFIED, and an unverified tree does not ship."
              exit 1
            fi
          fi
          python3 - <<'PY'
          import json, pathlib, sys
          raw = pathlib.Path("audit.json").read_text()
          if not raw.strip():
              print("::error::empty audit report — nothing was verified")
              sys.exit(1)
          d = json.loads(raw)
          vulns = d.get("vulnerabilities", {}).get("list", [])
          for v in vulns:
              a = v.get("advisory", {})
              print(f"::error::{a.get('id')} {a.get('package')}: {a.get('title')}")
          for kind, items in d.get("warnings", {}).items():
              for w in items:
                  a = (w.get("advisory") or {})
                  print(f"::warning::{kind}: {a.get('package') or w.get('package')}")
          if vulns:
              print(f"::error::{len(vulns)} vulnerability advisories — not shipping")
              sys.exit(1)
          print("no vulnerability advisories")
          PY

  # greenpiste stands alone (ADR-0064 `harness.standalone-tools`): installed
  # by install/install.sh from the archives this run built, on a clean runner
  # with no grh, it answers its own commands, and its old name runs as the
  # same build.
  standalone:
    name: greenpiste stands alone (${{ matrix.os }})
    needs: [guard, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - uses: actions/download-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: x86_64-pc-windows-msvc
          path: dist
      - name: Install from the built archives and run it with no grh (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command grh -ErrorAction SilentlyContinue) {
            Write-Error 'grh is on this runner; the check would prove nothing'
          }
          # install.ps1 verifies against SHA256SUMS, so write one for the dir.
          $dist = Join-Path $PWD 'dist'
          $lines = Get-ChildItem -Path $dist -File | Where-Object { $_.Name -ne 'SHA256SUMS' } |
            ForEach-Object { "$((Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          Set-Content -Path (Join-Path $dist 'SHA256SUMS') -Value $lines
          $bin = Join-Path $env:RUNNER_TEMP 'bin'
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          $env:GREENPISTE_ARCHIVE_DIR = $dist
          $env:AMONT_AGENT_BIN_DIR = $bin
          $env:AMONT_AGENT_VERSION = "v$env:VERSION"
          & ./install/install.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:PATH = "$bin;$env:PATH"
          foreach ($name in 'greenpiste', 'amont-agent') {
            $reported = (& $name --version | Out-String).Trim()
            Write-Host $reported
            if ($reported -ne "greenpiste $env:VERSION") { Write-Error "$name --version said: $reported" }
          }
      - name: Install from the built archives and run it with no grh
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          if command -v grh > /dev/null 2>&1; then
            echo "::error::grh is on this runner; the check would prove nothing"; exit 1
          fi
          # install.sh verifies against SHA256SUMS, so write one for the dir.
          (cd dist && sha256sum * > SHA256SUMS)
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          GREENPISTE_ARCHIVE_DIR="$PWD/dist" AMONT_AGENT_BIN_DIR="$bin" AMONT_AGENT_VERSION="v$version" \
            sh install/install.sh
          export PATH="$bin:$PATH"
          reported=$(greenpiste --version)
          printf '%s\n' "$reported"
          [ "$reported" = "greenpiste $version" ] || { echo "::error::greenpiste --version said: $reported"; exit 1; }
          rules=$(greenpiste rules --json)
          python3 -I -c 'import json, sys; json.loads(sys.argv[1])' "$rules"
          reported=$(amont-agent --version)
          printf '%s\n' "$reported"
          [ "$reported" = "greenpiste $version" ] || { echo "::error::amont-agent --version said: $reported"; exit 1; }
          cmp "$bin/greenpiste" "$bin/amont-agent"
          echo "greenpiste installs, runs and answers to amont-agent with no grh"

  # What a stranger gets: install.sh with no local archives, from the release
  # just published.
  post-publish:
    name: the published release installs
    needs: [guard, publish]
    if: needs.guard.outputs.dry_run == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install from the published release
        run: |
          set -euo pipefail
          version="${{ needs.guard.outputs.version }}"
          # No checkout: only what a stranger can fetch.
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/v$version/install/install.sh" -o "$RUNNER_TEMP/install.sh"
          AMONT_AGENT_BIN_DIR="$bin" AMONT_AGENT_VERSION="v$version" sh "$RUNNER_TEMP/install.sh"
          export PATH="$bin:$PATH"
          reported=$(greenpiste --version)
          printf '%s\n' "$reported"
          [ "$reported" = "greenpiste $version" ] || { echo "::error::greenpiste --version said: $reported"; exit 1; }
          rules=$(greenpiste rules --json)
          python3 -I -c 'import json, sys; json.loads(sys.argv[1])' "$rules"
          reported=$(amont-agent --version)
          [ "$reported" = "greenpiste $version" ] || { echo "::error::amont-agent --version said: $reported"; exit 1; }

  publish:
    name: publish the release
    needs: [guard, build, audit, standalone]
    runs-on: ubuntu-latest
    # `id-token: write` is the OIDC grant `attest-build-provenance` signs with;
    # `attestations: write` stores the result against this repo.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The manifest grh pins, written from the tarballs BEFORE SHA256SUMS so
      # it is checksummed and attested with them. Its [tool.release] names the
      # greenpiste-* tarballs only.
      - name: The manifest grh pins
        run: |
          set -euo pipefail
          python3 -I scripts/release-manifest.py "${{ needs.guard.outputs.version }}" \
            dist greenharness.toml dist/greenharness.toml
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      # Attest AFTER the checksums are written, so `SHA256SUMS` is itself a
      # subject. That is the point: the installer and the tap already verify
      # against that file, and until now it was served from the same origin
      # as the artifacts it vouched for — a checksum authenticates nothing
      # against a compromise of the place it came from. Anchoring the file
      # anchors every consumer downstream of it without changing one.
      #
      # Attestations go to GitHub's API, not into `dist`, so the `dist/*`
      # release glob below needs no change. Verify with:
      #   gh attestation verify <file> --repo greenharness/greenpiste
      - name: Attest
        if: needs.guard.outputs.dry_run == 'false'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      # A dry run stops here, having built and checksummed everything. The only
      # step it skips is the irreversible one.
      - name: Publish
        if: needs.guard.outputs.dry_run == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Idempotent, because re-running a release is a normal thing to want.
          # `gh release create` fails outright on "a release with the same tag
          # name already exists", which took down the whole run — and with it
          # `publish-crates`, which needs this job. That is precisely backwards:
          # the reason to re-run is usually that a LATER step failed.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            # A released asset is never replaced (no --clobber): grh pins the
            # manifest's digest, and an installer that checked an archive
            # once must find the same bytes again.
            #
            # A PUBLISHED (non-draft) release whose SHA256SUMS is listed is
            # COMPLETE: SHA256SUMS is uploaded with the archives, and a later
            # job failing is why anyone re-runs. Its assets are kept as they
            # are, and this run's build is not compared with them: a
            # `workflow_dispatch` on the tag rebuilds the archives, and tar
            # records file times, so the bytes differ while the release is
            # fine. The jobs after this one read the PUBLISHED assets, never
            # this run's (publish-tap reads SHA256SUMS).
            #
            # A draft, or a release without SHA256SUMS, stopped part-way: it is
            # finished by checking or uploading each asset, then published. An
            # asset there with other bytes is refused, because a half-published
            # set from two builds is not a release; re-run the FAILED jobs of
            # the original run (they reuse its build), not a new dispatch.
            # `gh release view`, not the tags API: an upload cut off part-way
            # leaves a DRAFT (gh creates the release as a draft, uploads,
            # then publishes), and the tags API does not see drafts.
            gh release view "${GITHUB_REF_NAME}" --json assets \
              --jq '.assets[] | .name + " " + (.digest // "")' > /tmp/published
            draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)
            # `awk` exits 0 when the name is listed: no `| grep -q` under
            # pipefail, which closes the pipe early.
            listed() { awk -v n="$1" '$1 == n { found = 1 } END { exit !found }' /tmp/published; }
            # Upload an asset the release lacks; refuse one it has with other
            # bytes (a half-published set from two builds is not a release).
            check_or_upload() {
              f="$1"
              name=$(basename "$f")
              if ! listed "$name"; then
                echo "uploading $name"
                gh release upload "${GITHUB_REF_NAME}" "$f"
                return
              fi
              want="sha256:$(sha256sum "$f" | cut -d' ' -f1)"
              have=$(awk -v n="$name" '$1 == n { print $2 }' /tmp/published)
              if [ -z "$have" ]; then
                gh release download "${GITHUB_REF_NAME}" --pattern "$name" --output /tmp/published-asset --clobber
                have="sha256:$(sha256sum /tmp/published-asset | cut -d' ' -f1)"
              fi
              if [ "$have" != "$want" ]; then
                echo "::error::$name on the release is $have, this build made $want; a released asset is never replaced."
                echo "::error::Re-run the failed jobs of the run that built it (they reuse its bytes), or delete the partial release's assets by hand and re-run, or release the next version."
                exit 1
              fi
              echo "$name is already on the release with this build's bytes"
            }
            if listed SHA256SUMS && [ "$draft" != true ]; then
              gh release download "${GITHUB_REF_NAME}" --pattern SHA256SUMS --output /tmp/published-sums --clobber
              missing=0
              while read -r _ name; do
                listed "$name" \
                  || { echo "::error::SHA256SUMS lists $name, which the release does not carry"; missing=1; }
              done < /tmp/published-sums
              if [ "$missing" -ne 0 ]; then
                echo "::error::Delete the partial release's assets by hand, then re-run, or release the next version."
                exit 1
              fi
              echo "release ${GITHUB_REF_NAME} is published and complete; its assets are kept"
            else
              # A draft, or a release without SHA256SUMS: nobody installed from
              # it yet, so finish it. The archives first, SHA256SUMS last, each
              # either uploaded or, when there, checked to be this build's
              # bytes; then publish a draft.
              echo "release ${GITHUB_REF_NAME} is unfinished (draft: $draft) — finishing it"
              for f in dist/*; do
                name=$(basename "$f")
                [ "$name" = SHA256SUMS ] && continue
                check_or_upload "$f"
              done
              check_or_upload dist/SHA256SUMS
              if [ "$draft" = true ]; then
                gh release edit "${GITHUB_REF_NAME}" --draft=false
              fi
            fi
          else
            # Notes an upgrader can read, then the generated PR list. Matching
            # on $2 rather than a prefix so extracting v1.0.2 can never grab
            # v1.0.21. The guard job already proved the CHANGELOG section
            # exists.
            notes=$(mktemp)
            awk -v ver="${GITHUB_REF_NAME}" '
              $1 == "##" && $2 == ver { grab = 1; next }
              $1 == "##" && grab      { exit }
              grab                    { print }
            ' CHANGELOG.md > "$notes"
            printf '\n---\n\n' >> "$notes"
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${GITHUB_REF_NAME}" --jq .body >> "$notes"
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes" \
              dist/*
          fi
      - name: Dry run summary
        if: needs.guard.outputs.dry_run == 'true'
        run: |
          echo "### Dry run — nothing published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # IMMUTABLE, so a bad publish can only be yanked and superseded, never fixed.
  #
  # `needs: build` on purpose. If a target does not compile, that is a release
  # nobody should be able to `cargo install` either.
  publish-crates:
    name: publish to crates.io
    needs: [guard, build, publish]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        run: |
          set -euo pipefail
          # No poll after the upload. cargo ALREADY waits for it to become
          # available — the run log reads "waiting for X to be available at
          # registry" then "Published X" — and the crates.io API rate-limits
          # datacenter IPs, so a poll on top saw non-200 for a crate that had
          # just published fine and failed the job ten minutes later.
          #
          # Idempotency comes from cargo's own answer instead: re-running a
          # release must not fail on a crate that is already up, and "already
          # uploaded" is exactly that answer — anything else is a real failure.
          #
          # The libraries first, in dependency order: `greenpiste` resolves
          # them from crates.io by version. A rerun resumes a partial publish,
          # because each crate already up is "already uploaded".
          for crate in greenpiste-guard greenpiste-process greenpiste; do
            echo "→ publishing $crate $VERSION"
            if out=$(cargo publish -p "$crate" --locked 2>&1); then
              printf '%s\n' "$out"
            else
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qiE "already (been )?uploaded|already exists"; then
                echo "  $crate $VERSION was already published — continuing"
              else
                echo "::error::publishing $crate failed"
                exit 1
              fi
            fi
          done
          echo "### Published to crates.io" >> "$GITHUB_STEP_SUMMARY"
          echo "\`cargo install greenpiste\` — v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The tap formula, bumped by the release rather than by hand: a release is
  # not published until `brew upgrade` can see it.
  #
  # Auth is a deploy key that can write to the TAP REPOSITORY and nothing else
  # (secret TAP_DEPLOY_KEY) — narrower than any PAT. The rewrite is
  # scripts/bump-tap.py, which asserts on every surprise rather than sedding
  # hopefully, and `ruby -c` proves the result is at least a formula before
  # anything is pushed.
  publish-tap:
    name: publish to the homebrew tap
    # After crates.io too: brew never offers a version `cargo install` lacks.
    needs: [guard, publish, publish-crates]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # From the PUBLISHED release, not from this run's artifacts: the formula
      # must name the bytes an installer will actually download, and reading
      # them back from the release asserts they are there.
      #
      # The musl binary comes too, checked against those sums: its own
      # `rules --json` is where the caveat's list of rules that refuse by
      # default comes from. No git config reaches it, though bump-tap.py reads
      # `default_stance`, which no config changes anyway. The step sets
      # pipefail itself: this job has no default shell, and GitHub's default
      # `bash -e` has none.
      - name: Download the published checksums and binary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          musl="greenpiste-$VERSION-x86_64-unknown-linux-musl"
          gh release download "v$VERSION" --pattern SHA256SUMS --pattern "$musl.tar.gz"
          sha256sum -c --ignore-missing SHA256SUMS
          mkdir rel && tar -xzf "$musl.tar.gz" -C rel
          GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 \
            "rel/$musl/greenpiste" rules --json > rules.json
          test -s rules.json
      - name: Clone the tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          echo "GIT_SSH_COMMAND=ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" >> "$GITHUB_ENV"
          GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes" \
            git clone --depth 1 git@github.com:fredericrous/homebrew-tap.git tap
      # The formula is greenpiste's own (packaging/homebrew/greenpiste.rb),
      # rewritten from the published SHA256SUMS and binary. The rename of the
      # old formula goes in the SAME tap commit, written only now that the
      # assets exist: `formula_renames.json` makes `brew upgrade` move an
      # installed old formula to greenpiste, and the old formula file is
      # removed so the old name cannot be installed beside it.
      - name: Rewrite the formula
        run: |
          set -euo pipefail
          cp packaging/homebrew/greenpiste.rb tap/Formula/greenpiste.rb
          python3 -I scripts/bump-tap.py "$VERSION" SHA256SUMS rules.json tap/Formula/greenpiste.rb
          ruby -c tap/Formula/greenpiste.rb
          python3 -I - tap/formula_renames.json <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          renames = json.loads(path.read_text()) if path.exists() else {}
          renames["amont-agent"] = "greenpiste"
          path.write_text(json.dumps(renames, indent=2, sort_keys=True) + "\n")
          PY
          rm -f tap/Formula/amont-agent.rb
      - name: Push
        run: |
          set -euo pipefail
          cd tap
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "the tap already carries $VERSION — nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/greenpiste.rb formula_renames.json
          git add -u Formula
          git commit -m "chore: greenpiste $VERSION"
          git push origin HEAD
          echo "### Published to the homebrew tap" >> "$GITHUB_STEP_SUMMARY"
          echo "\`brew upgrade fredericrous/tap/greenpiste\` — v$VERSION" >> "$GITHUB_STEP_SUMMARY"

  # The only thing anywhere that runs the formula.
  #
  # `publish-tap` above proves the file PARSES (`ruby -c`) and that its
  # checksums match the release. Neither is the question a user asks, which
  # is "does `brew install` work" — and the gap between those is not
  # theoretical. amont's formula carried a `bin.install` line for a binary
  # that had left its archive three releases earlier; `bin.install` on a file
  # that is not there aborts the whole formula, so every `brew install`
  # failed outright while every release went green. Checksums matched, syntax
  # was valid, and the bumper rewrites only the version and the url/sha
  # pairs, so nothing it touched would notice. A human running `brew upgrade`
  # by hand found it.
  #
  # This job FAILS the run rather than warning. The release is already
  # published by the time it runs and cannot be unpublished, so the point is
  # not to prevent it — it is to make a broken install path impossible to
  # miss. A warning would reproduce exactly the condition that let it ship.
  verify-brew:
    name: brew can install what was published
    needs: [guard, publish-tap]
    if: github.ref_type == 'tag'
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      # No checkout: this must see only what a stranger sees — the tap and
      # the published release. Anything read out of the repository would be
      # testing the thing we already know.
      # An existing install upgrades: the previous formula (the tap's parent
      # commit) installed first, then the tap moved to HEAD and `brew upgrade`.
      - name: Upgrade from the previous formula
        run: |
          set -euo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          brew tap fredericrous/tap
          tap_dir=$(brew --repository fredericrous/tap)
          head_ref=$(git -C "$tap_dir" rev-parse HEAD)
          git -C "$tap_dir" checkout --quiet "$head_ref~1"
          brew install fredericrous/tap/amont-agent
          git -C "$tap_dir" checkout --quiet "$head_ref"
          brew upgrade
          for name in greenpiste amont-agent; do
            reported=$("$name" --version)
            printf '%s\n' "$reported"
            [ "$reported" = "greenpiste $VERSION" ] || { echo "::error::$name --version said: $reported"; exit 1; }
          done

      - name: Install from the tap
        run: |
          set -euo pipefail
          brew tap fredericrous/tap
          brew install fredericrous/tap/greenpiste

      - name: The installed binary is the version just published
        run: |
          set -euo pipefail
          reported=$(greenpiste --version)
          printf '%s\n' "$reported"
          [ "$reported" = "greenpiste $VERSION" ] || { echo "::error::greenpiste --version said: $reported"; exit 1; }
          # The old name, a copy of the same build.
          reported=$(amont-agent --version)
          [ "$reported" = "greenpiste $VERSION" ] || { echo "::error::amont-agent --version said: $reported"; exit 1; }

      # It still DECIDES, not merely starts. A guard that installs and then
      # refuses nothing is the defect no unit test can see, because tests
      # never touch the packaged artifact — let alone the brewed one.
      - name: The installed guard still says no
        run: |
          set -euo pipefail
          out=$(greenpiste check 'git push origin main 2>&1 | tail -5')
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'pipe-to-tail'

      - name: brew test
        run: brew test fredericrous/tap/greenpiste

      - name: Say so
        run: |
          echo "### brew install verified" >> "$GITHUB_STEP_SUMMARY"
          echo "\`brew install fredericrous/tap/greenpiste\` produces v$VERSION" >> "$GITHUB_STEP_SUMMARY"
