[package]
name = "amont-agent-process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "amont-agent's work process: plan review, implementation review, preview approvals and provenance"
readme = "../../README.md"
keywords = ["claude", "hooks", "review", "provenance"]
categories = ["development-tools"]

[dependencies]
amont-agent-guard.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }

# A plan's sha (`plan_review::body_sha`) is taken over the Markdown as
# CommonMark reads it, so a formatter that only moves blank lines, list
# markers or table padding keeps the review bound, while `a * b` and a list
# item `* b` stay different things. Telling those apart needs block context:
# a parser, not a line rule (2026-10-06, docs/plans/2026-10-06-plan-sha-ignores-formatting.md).
#
# PINNED EXACTLY: a parser change may change the sha of every plan and
# turn every review in flight stale. A bump is its own PR, and the
# `body_sha` fixture test is what tells you whether it re-hashes.
#
# What this owns: pulldown-cmark plus `bitflags`, `memchr` and `unicase`,
# all with default features off or unused. Only pulldown-cmark has a build
# script, and without its `gen-tests` feature it compiles to an empty
# `main` (spec-test generation); the other three have none. It is
# the CommonMark parser rustdoc and mdBook use, released a few times a year;
# MSRV 1.71.1, under ours. If it were abandoned, the pin keeps building, and
# the fallback is the rung rejected on 2026-10-06: a hand-rolled block
# scanner, which would have to own CommonMark's list, quote, fence and
# container-indent rules — the edge cases the line rules got wrong.
pulldown-cmark = { version = "=0.13.5", default-features = false }

[lints]
workspace = true
